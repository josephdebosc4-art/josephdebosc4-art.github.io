<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Connexion TikTok</title><link rel="stylesheet" href="../style.css"></head><body><main>
<h1>Connexion TikTok</h1><div class="card" id="box"><p class="muted">Lecture de la réponse de TikTok…</p></div>
<script>
const p=new URLSearchParams(location.search),box=document.getElementById('box');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(p.get('code')){
  box.innerHTML='<p>✅ Autorisation reçue. Copie ce code et donne-le à Claude (il expire au bout de quelques minutes) :</p><p><code id="c">'+esc(p.get('code'))+'</code></p><button id="b">Copier le code</button>';
  document.getElementById('b').onclick=async()=>{try{await navigator.clipboard.writeText(p.get('code'));document.getElementById('b').textContent='Copié ✔'}catch(e){getSelection().selectAllChildren(document.getElementById('c'))}};
}else if(p.get('error')){
  box.innerHTML='<p>❌ TikTok a refusé : <code>'+esc(p.get('error'))+'</code></p><p class="muted">'+esc(p.get('error_description')||'')+'</p>';
}else{box.innerHTML='<p class="muted">Aucun code reçu. Cette page sert de retour après la connexion TikTok.</p>'}
</script></main></body></html>
